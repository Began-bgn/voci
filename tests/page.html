<!doctype html>
<meta charset="utf-8">
<title>Voci test page</title>
<!-- ?field=ta|ce&text=...&caret=N presets field, content and cursor. Served over http by tests/live.sh.
     &nofocus=1 leaves nothing focused and shows only that field at the bottom of the page;
     &chat=1 also adds a plain text input at the top, like a chat app's search box. -->
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; font: 14px system-ui; }
  textarea, #ce, #top { margin: 12px; }
  #ce { border: 1px solid #888; min-height: 4em; }
</style>
<input id="top" type="text" placeholder="Top input" hidden>
<div style="flex:1; padding:12px">Conversation area</div>
<textarea id="ta" rows="4" cols="80"></textarea>
<div id="ce" contenteditable="true"></div>
<script>
  const q = new URLSearchParams(location.search);
  const text = q.get("text") || "";
  const caret = q.has("caret") ? +q.get("caret") : text.length;
  const ce = q.get("field") === "ce";
  const el = document.getElementById(ce ? "ce" : "ta");
  const nofocus = q.has("nofocus");
  if (nofocus) document.getElementById(ce ? "ta" : "ce").hidden = true;
  if (q.has("chat")) document.getElementById("top").hidden = false;
  if (ce) el.textContent = text; else el.value = text;
  if (!nofocus) {
    el.focus();
    if (ce) {
      const r = document.createRange();
      r.setStart(el.firstChild || el, el.firstChild ? caret : 0);
      r.collapse(true);
      getSelection().removeAllRanges(); getSelection().addRange(r);
    } else {
      el.setSelectionRange(caret, caret);
    }
  } else {
    document.activeElement && document.activeElement.blur();
  }
</script>
